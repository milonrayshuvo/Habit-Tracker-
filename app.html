<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Habits</title>
</head>
<body>
<script>
fetch('index.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(h){
  var i=h.lastIndexOf('</body>');
  if(i<0)throw 0;
  h=h.slice(0,i)+'<script src="subjects.js"><\/script>'+h.slice(i);
  document.open();document.write(h);document.close();
}).catch(function(){location.replace('index.html')});
</script>
</body>
</html>
