<main>
  <section id="v1">
    <div class="top"><button id="pv">‹</button><div><div id="dt"></div><small id="dn"></small></div><button id="nx">›</button></div>
    <div id="cd" class="cdc"></div>
    <div class="big"><b id="bn"></b><span id="bt"></span></div>
    <div class="line"><i id="bl"></i></div>
    <div id="b3"></div><div id="list"></div><div id="rcv"></div><div id="bk"></div>
  </section>
  <section id="v2" class="hide"><div id="dash"></div></section>
  <section id="v3" class="hide">
    <h3 style="margin-top:28px">Plan</h3>
    <div class="f"><span>Start date</span><input type="date" id="start"></div>
    <div class="f"><span id="tdl">Target days (Fridays extra)</span><input type="number" id="days" min="1" max="365"></div>
    <div class="f"><span>Friday bonus<small class="fsub" id="frst"></small></span><button class="sw" id="frsw" aria-label="Friday bonus mode"></button></div>
    <h3>Goals <span class="lgd">daily target (min)</span></h3><div id="gl"></div>
    <div class="act"><button id="addg">+ Add goal</button></div>
    <h3>Big 3 <span class="lgd" id="b3d"></span></h3><div id="b3e"></div>
    <h3>Cloud sync</h3>
    <input id="cu" placeholder="Script URL (https://script.google.com/.../exec)" style="width:100%;margin-bottom:8px">
    <input id="ck" type="password" placeholder="Secret code" style="width:100%">
    <div class="act"><button id="csv">Save &amp; sync</button><button id="crs">Restore from cloud</button></div>
    <p id="syncst" class="foot" style="text-align:left"></p>
    <h3>Data</h3>
    <div class="act"><button id="exp">Backup</button><button id="imp">Restore</button><button id="rst" class="d">Clear entries</button><button id="undo" class="hide">Undo</button></div>
    <input type="file" id="file" accept=".json" class="hide">
  </section>
  <section id="v4" class="hide"><div id="rep"></div></section>
</main>
<nav><div><button id="t1" class="on">Today</button><button id="t2">Dashboard</button><button id="t3">Settings</button></div></nav>
</div>
<div class="pmx"><button id="pmp">Save as PDF</button><button id="pmb">← Back</button></div>
<script>
const KEY='habit_tracker_v1';
const SAMPLE={start:'2026-09-28',days:120,tgt:[60,60,60,60,60,60,0,0],goals:["📚 8:00–9:00 → AM","🎯 9:00–10:00 → AM","✒️ 11:30–12:30 → AM","📝 8:00–9:00 → PM","📖 9:00–10:00 → PM","📙 11:00–12:00 → PM","📝 Review Days","✊ Hold On"],log:{1:"01110011",2:"00010001",3:"01111001",4:"11100000",5:"01111000",6:"101----0"}};
let S=load(),cur=1,view=1,dodAll=false,notesAll=false;
const CATS=['Sleep','Phone/Distraction','Social/Chatting','Health/Appointment','Family/Work','Low Energy','Poor Planning','Emergency','Other'],FXS=['Fix your sleep and wake time so the first slot starts fresh.','Keep the phone out of reach during study slots.','Set a chat-free window before your hardest slot.','Plan lighter slots around appointments.','Agree on protected study hours with family or work.','Put hard subjects in your higher-energy slots.','Decide tomorrow\'s subject and task the night before.','Keep one flexible slot as an emergency buffer.','Review what got in the way and adjust one slot.'];
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.goals)return s}catch(e){}return JSON.parse(JSON.stringify(SAMPLE))}
function save(){S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}sched()}
const $=id=>document.getElementById(id);
const pct=x=>Math.round(x*100)+'%';
const dur=m=>m>=60?Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':''):m+'m';
function autoMin(n){const m=String(n).match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/);if(!m)return 0;const a=+m[1]*60+ +m[2],b=+m[3]*60+ +m[4];return((b-a)%720+720)%720}
function bank(upTo){
  let earned=0,used=0;
  for(let d=1;d<=upTo;d++)earned+=+S.ex[d]||0;
  for(const k in S.pay){const p=k.split(':').map(Number);if(p[0]<=upTo&&cell(p[0],p[1])==='0')used+=+S.pay[k]||0}
  return{bal:Math.max(0,earned-used),earned,used}
}
function bkHtml(d,g){
  const t=S.tgt[g]||0;if(!t)return'';const p=+S.pay[d+':'+g]||0;
  if(p)return '<button class="bkb on" data-p="'+g+'">✓ '+dur(p)+' used from bank'+(p<t?' · '+dur(t-p)+' still missed':'')+' (tap to undo)</button>';
  return '<button class="bkb" data-p="'+g+'">Use '+dur(t)+' from bank ('+dur(bank(d).bal)+' available)</button>'
}
function ensure(){if(!Array.isArray(S.tgt))S.tgt=[];S.goals.forEach((g,i)=>{if(typeof S.tgt[i]!=='number')S.tgt[i]=autoMin(g)});S.tgt.length=S.goals.length;['sub','tk'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];S[k].length=S.goals.length;for(let i=0;i<S.goals.length;i++)if(typeof S[k][i]!=='string')S[k][i]=''});S.cat=S.cat||{};S.rec=S.rec||{};S.ex=S.ex||{};S.pay=S.pay||{};S.b3=S.b3||{};if(!Array.isArray(S.b3t)){S.b3t=['','',''];for(const k of Object.keys(S.b3).map(Number).sort((a,b)=>b-a)){const a=S.b3[k]||[];if(a.some(x=>x&&x.t)){S.b3t=[0,1,2].map(i=>(a[i]&&a[i].t)||'');break}}}for(let i=0;i<3;i++)if(typeof S.b3t[i]!=='string')S.b3t[i]='';S.b3t.length=3;if(!Array.isArray(S.b3g))S.b3g=[0,0,0];for(let i=0;i<3;i++)if(!(S.b3g[i]>0))S.b3g[i]=0;S.b3g.length=3}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const dateOf=n=>{const d=new Date(S.start+'T00:00:00');d.setDate(d.getDate()+n-1);return d};
const fri=d=>S.fb!==false&&dateOf(d).getDay()===5;
const nf=(a,b)=>{let n=0;for(let d=a;d<=b;d++)if(!fri(d))n++;return n};
const nfMs=(a,b)=>{let ms=0,d=new Date(a);d.setHours(0,0,0,0);while(d<b){const e=new Date(d);e.setDate(e.getDate()+1);if(S.fb===false||d.getDay()!==5){const x=Math.max(a,d),y=Math.min(b,e);if(y>x)ms+=y-x}d=e}return ms};
const TL=()=>{let n=0,d=0;while(n<S.days&&d<800){d++;if(!fri(d))n++}return d};
const fmt=(d,o)=>d.toLocaleDateString('en-GB',o);
const cell=(d,g)=>(S.log[d]||'')[g]||'-';
function setCell(d,g,v){const a=(S.log[d]||'').padEnd(S.goals.length,'-').split('');a[g]=v;S.log[d]=a.join('')}
function setNote(d,g,v){v=String(v||'').trim().slice(0,500);const k=d+':'+g;if(v){(S.notes=S.notes||{})[k]=v}else if(S.notes)delete S.notes[k];save()}
function ntHtml(d,g){const t=(S.notes||{})[d+':'+g];return '<button class="nt'+(t?' has':'')+'" data-n="'+g+'">'+(t?'📝 '+esc(t):(fri(d)?'＋ Why did you skip this free day? Add a note':'＋ কেন হয়নি? নোট লিখুন'))+'</button>'}
function catHtml(d,g){const v=S.cat[d+':'+g]||'';return '<select class="nc" data-c="'+g+'"><option value="">Reason…</option>'+CATS.map(c=>'<option'+(c===v?' selected':'')+'>'+c+'</option>').join('')+'</select>'}
function b3x(d,i){return !!((S.b3[d]||[])[i]||{}).d}
function b3s(i,d){let s=0;for(let x=d;x>=1;x--){if(b3x(x,i))s++;else if(x!==d&&!fri(x))break}return s}
function b3a(){return S.b3[cur]||(S.b3[cur]=[{t:'',d:0},{t:'',d:0},{t:'',d:0}])}
function extras(){
  const T=S.b3t,n=T.filter((s,i)=>s&&b3x(cur,i)).length;
  $('b3').innerHTML='<div class="b3"><div class="b3h"><b>Today’s Big 3</b><span>'+n+'/3</span></div>'+(T.some(Boolean)?T.map((s,i)=>{if(!s)return'';const d=b3x(cur,i),k=b3s(i,cur);return'<button class="b3r'+(d?' d':'')+'" data-b="'+i+'"><span class="ck'+(d?' y':'')+'">'+(d?'✓':'')+'</span><span class="b3t">'+esc(s)+'</span>'+(k?'<span class="b3s">🔥 '+k+'</span>':'')+'</button>'}).join(''):'<p class="np" style="margin:2px 0 4px">Add your 3 tasks in Settings.</p>')+'</div>';
  let m=0;for(let g=0;g<S.goals.length;g++)if(cell(cur,g)==='0'&&!fri(cur))m+=S.tgt[g]||0;
  const r=Math.min(90,m);$('rcv').innerHTML=r?'<button class="rcb'+(S.rec[cur]?' on':'')+'" id="rcbt">↻ Recovery (optional, max 90m): '+dur(r)+(S.rec[cur]?' · done ✓':'')+'</button>':'';
  const bk=bank(cur),ex=+S.ex[cur]||0;
  $('bk').innerHTML='<div class="bkc"><div class="bkh"><span>🏛️ Bonus bank</span><span class="bkg">'+dur(bk.bal)+' banked</span></div><div class="bkr"><span>Extra studied today</span><b>'+dur(ex)+'</b></div><div class="bkq"><button data-add="10">+10</button><button data-add="20">+20</button><button data-add="30">+30</button></div><div class="bkm"><input id="bkv" type="number" inputmode="decimal" min="0" step="any" placeholder="Custom, e.g. 45"><select id="bku"><option value="m">Minutes</option><option value="h">Hours</option></select><button data-man="1">Add</button></div>'+(ex?'<button class="bkx" data-clr="1">Clear extra for today</button>':'')+'</div>'
}
function rx(o,i){const n={};for(const k in o||{}){const p=k.split(':').map(Number);if(p[1]===i)continue;n[p[0]+':'+(p[1]>i?p[1]-1:p[1])]=o[k]}return n}
function todayIdx(){const t=new Date();t.setHours(0,0,0,0);return Math.round((t-dateOf(1))/864e5)+1}
function clampDay(){cur=Math.max(1,Math.min(TL(),cur))}

function calc(){
  const G=S.goals.length,D=TL(),per=[];let tot=0,tracked=0;const dd=[];
  for(let g=0;g<G;g++){let y=0,c=0,b=0;
    for(let d=1;d<=D;d++){const v=cell(d,g);if(v==='1'){y++;c++;b=Math.max(b,c)}else if(v==='0'&&!fri(d))c=0}
    per.push({y,c,b})}
  for(let d=1;d<=D;d++){let n=0,a=false;for(let g=0;g<G;g++){const v=cell(d,g);if(v==='1')n++;if(v!=='-')a=true}dd[d]=n;tot+=n;if(a)tracked++}
  ensure();let inv=0,dt=0;for(let g=0;g<G;g++){inv+=per[g].y*(S.tgt[g]||0);dt+=S.tgt[g]||0}
  return{G,D,per,tot,tracked,dd,inv,dt}
}

function row(t,r,sub,extra){return '<div class="gr"><div class="gt"><span>'+t+'</span><b>'+pct(r)+'</b></div><div class="b2"><i style="width:'+Math.max(0,Math.min(1,r))*100+'%"></i></div><div class="gs">'+sub+'</div></div>'}

function render(){
  ensure();clampDay();const c=calc(),{G,D}=c;
  const d=dateOf(cur),ti=todayIdx();
  $('dt').textContent=ti===cur?'Today':fmt(d,{weekday:'short',day:'numeric',month:'short'});
  $('dn').textContent=(ti===cur?fmt(d,{weekday:'short',day:'numeric',month:'short'})+' · ':'')+(fri(cur)?'🎁 Free day · use it if you want, or waste it':'Day '+nf(1,cur)+' of '+S.days);
  let td=0;for(let g=0;g<G;g++)if(cell(cur,g)==='1')td+=S.tgt[g]||0;
  $('bn').textContent=c.dd[cur];$('bt').textContent='of '+G+' done'+(c.dt?' · '+dur(td)+' of '+dur(c.dt):'');
  $('bl').style.width=(G?c.dd[cur]/G*100:0)+'%';
  $('list').innerHTML=S.goals.map((n,g)=>{const v=cell(cur,g);
    return '<div class="rw"><button class="row'+(v==='1'?' done':'')+'" data-g="'+g+'"><span class="nm">'+esc(n)+(S.tgt[g]?'<small>'+dur(S.tgt[g])+' target</small>':'')+(S.sub[g]||S.tk[g]?'<small>'+esc([S.sub[g],S.tk[g]].filter(Boolean).join(' → '))+'</small>':'')+'</span><span class="ck '+(v==='1'?'y':v==='0'?(S.pay[cur+':'+g]>0?'b':'n'):'')+'">'+(v==='1'?'✓':v==='0'?(S.pay[cur+':'+g]>0?((+S.pay[cur+':'+g]>=(S.tgt[g]||0))?'✓':'½'):'✕'):'')+'</span></button>'+(v==='0'?(fri(cur)?'':bkHtml(cur,g))+catHtml(cur,g)+ntHtml(cur,g):'')+'</div>'}).join('');
  extras();cd();renderDash(c);
}

function cd(){
  const el=$('cd');if(!el)return;
  const st=dateOf(1),en=dateOf(TL());en.setDate(en.getDate()+1);const n=new Date();let lab,t;
  if(n>=en){el.innerHTML='<div class="cdl"><span>Target complete</span></div>';return}
  if(n<st){lab='Starts in';t=st-n}else{lab='Time left'+(S.fb!==false&&n.getDay()===5?' · ⏸ Friday bonus':'');t=nfMs(n,en)}
  const s=Math.floor(t/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=v=>String(v).padStart(2,'0');
  const pr=n<st?0:Math.min(1,nfMs(st,n)/nfMs(st,en));
  el.innerHTML='<div class="cdl"><span>'+lab+'</span><span>Ends '+fmt(new Date(en-1),{weekday:'short',day:'numeric',month:'short'})+'</span></div><div class="cdg">'+[[d,'Days'],[h,'Hours'],[m,'Min'],[x,'Sec']].map(a=>'<div><b>'+p(a[0])+'</b><span>'+a[1]+'</span></div>').join('')+'</div><div class="b2"><i style="width:'+(pr*100).toFixed(1)+'%"></i></div>'
}
function ring(p){const C=2*Math.PI*54;return '<svg viewBox="0 0 130 130" class="ring"><circle cx="65" cy="65" r="54" class="rt"/><circle cx="65" cy="65" r="54" class="rf" stroke-dasharray="'+(C*Math.max(0,Math.min(1,p))).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 65 65)"/><text x="65" y="68" text-anchor="middle" class="rn">'+Math.round(p*100)+'<tspan class="rp">%</tspan></text><text x="65" y="87" text-anchor="middle" class="rl">COMPLETION</text></svg>'}
function renderDash(c){
  const {G,D}=c,ti=todayIdx(),el=Math.max(0,Math.min(D,ti)),left=Math.max(0,D-el);
  const dm={day:'numeric',month:'short'},ov=(()=>{let n=0;for(let d=1;d<=D;d++)if(!fri(d))n++;return n*G?c.tot/(n*G):0})(),pend=D*G-c.tot;
  const range=fmt(dateOf(1),{day:'numeric',month:'short',year:'numeric'})+' – '+fmt(dateOf(D),{day:'numeric',month:'short',year:'numeric'});
  const gen=fmt(new Date(),{day:'numeric',month:'long',year:'numeric'});
  const trk=[],pc=[];let sumP=0,perfect=0,last=0;
  for(let d=1;d<=D;d++){let a=false;for(let g=0;g<G;g++)if(cell(d,g)!=='-'){a=true;break}
    trk[d]=a;pc[d]=G?c.dd[d]/G:0;if(a){sumP+=pc[d];last=d;if(G&&c.dd[d]===G)perfect++}}
  const avg=c.tracked?sumP/c.tracked:0;
  let streak=0;for(let d=last;d>=1;d--){if(fri(d)){if(trk[d]&&pc[d]>=.5)streak++;continue}if(!(trk[d]&&pc[d]>=.5))break;streak++}
  const WN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],WL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],ws=Array(7).fill(0),wn=Array(7).fill(0);
  for(let d=1;d<=D;d++)if(trk[d]){const k=(dateOf(d).getDay()+6)%7;ws[k]+=pc[d];wn[k]++}
  const wa=ws.map((v,k)=>wn[k]?v/wn[k]:0);let bw=-1;wa.forEach((v,k)=>{if(wn[k]&&(bw<0||v>wa[bw]))bw=k});
  const wcols=wa.map((v,k)=>'<div class="col"><em>'+(wn[k]?Math.round(v*100):'–')+'</em><div class="cb"><i style="height:'+Math.max(3,v*100)+'%"'+(k===bw?'':' class="dim"')+'></i></div><small>'+WN[k]+'</small></div>').join('');
  let a1='–',p1='',a2='–',p2='';
  if(c.tracked>0&&G>1){const r=c.per.map((p,g)=>({g,r:p.y/c.tracked})).sort((x,y)=>y.r-x.r);a1=esc(S.goals[r[0].g]);p1=pct(r[0].r);a2=esc(S.goals[r[r.length-1].g]);p2=pct(r[r.length-1].r)}
  const ins='<div class="ins3"><div class="card"><small>STRONGEST GOAL</small><p>'+a1+'</p><b class="ok">'+p1+'</b></div><div class="card"><small>NEEDS FOCUS</small><p>'+a2+'</p><b class="bad">'+p2+'</b></div><div class="card"><small>BEST WEEKDAY</small><p>'+(bw>=0?WL[bw]:'–')+'</p><b class="ok">'+(bw>=0?pct(wa[bw]):'')+'</b></div></div>';
  let bars='',pts=[],win=[];
  for(let d=1;d<=D;d++)if(trk[d]){const h=Math.max(1,pc[d]*100);bars+='<rect x="'+(d-1)+'" y="'+(100-h)+'" width=".8" height="'+h+'" class="tb"/>';
    win.push(pc[d]);if(win.length>7)win.shift();const m=win.reduce((x,y)=>x+y,0)/win.length;pts.push((d-.4).toFixed(2)+','+(100-m*100).toFixed(1))}
  const trend='<svg viewBox="0 0 '+D+' 100" preserveAspectRatio="none"><line x1="0" x2="'+D+'" y1="50" y2="50" class="gl"/>'+bars+(pts.length>1?'<polyline points="'+pts.join(' ')+'" class="tl2"/>':'')+'</svg>';
  let cells='';
  for(let g=0;g<G;g++)for(let d=1;d<=D;d++){const v=cell(d,g);cells+='<rect x="'+(d-1)*8+'" y="'+g*16+'" width="7" height="14" rx="1.5" class="'+(v==='1'?'hy':v==='0'?(S.pay[d+':'+g]>0?'hb':'hn'):'he')+'"/>'}
  const hm='<div class="hm" style="--n:'+G+'"><div class="hl">'+S.goals.map(n=>'<div>'+esc(n)+'</div>').join('')+'</div><div class="hr"><svg viewBox="0 0 '+D*8+' '+G*16+'" preserveAspectRatio="none">'+cells+'</svg><div class="ax"><span>Day 1</span><span>Day '+D+'</span></div></div></div>';
  const goals=S.goals.map((n,g)=>{const p=c.per[g],t=S.tgt[g]||0;return row(esc(n)+(t?'<em class="tg">'+dur(t)+'/day</em>':''),nf(1,D)?p.y/nf(1,D):0,'<span>✔ '+p.y+' days</span>'+(t?'<span>⏱ '+dur(p.y*t)+'</span>':'')+'<span>🔥 '+p.c+' streak</span><span>🏆 '+p.b+' best</span>')}).join('');
  const tmin=d=>{let s=0;for(let g=0;g<G;g++)if(cell(d,g)==='1')s+=S.tgt[g]||0;return s};
  const tdays=[];for(let d=1;d<=D;d++)if(trk[d])tdays.push(d);
  let up=0,dn=0,eq=0;
  const drows=tdays.map((d,i)=>{
    const pv=i?tdays[i-1]:0,dp=pv?Math.round(pc[d]*100)-Math.round(pc[pv]*100):null,dg=pv?c.dd[d]-c.dd[pv]:null;
    let cls='fl',tx='—',sb='first day';
    if(dp!==null){
      if(dp>0){up++;cls='ok';tx='▲ +'+dp+'%'}else if(dp<0){dn++;cls='bad';tx='▼ −'+Math.abs(dp)+'%'}else{eq++;tx='＝ 0%'}
      sb=(dg>0?'+':dg<0?'−':'±')+Math.abs(dg)+' goal'+(Math.abs(dg)===1?'':'s')+' vs Day '+pv;
    }
    return{d,cls,tx,sb,
      h:'<div class="dr"><div class="dd"><b>'+fmt(dateOf(d),{weekday:'short',day:'numeric',month:'short'})+'</b><small>Day '+d+'</small></div>'+
      '<div><div class="b2"><i style="width:'+Math.round(pc[d]*100)+'%"></i></div><div class="gs"><span>'+c.dd[d]+'/'+G+' · '+pct(pc[d])+'</span>'+(c.dt?'<span>⏱ '+dur(tmin(d))+'</span>':'')+'</div></div>'+
      '<div class="dv '+cls+'">'+tx+'<small>'+sb+'</small></div></div>'};
  }).reverse();
  const shown=dodAll?drows:drows.slice(0,7);
  const dod=drows.length?'<div class="dod"><h3>Day-over-day change</h3><div class="card">'+
    '<div class="sm"><span class="ok">▲ '+up+' up</span><span class="bad">▼ '+dn+' down</span><span style="color:var(--sub)">＝ '+eq+' same</span><span class="lt">Each day compared with the previous tracked day</span></div>'+
    '<div class="rows">'+shown.map(r=>r.h).join('')+'</div>'+
    (drows.length>7?'<button class="dodb" id="dodb">'+(dodAll?'Show less':'Show all '+drows.length+' days')+'</button>':'')+
    '</div></div>':'';
  let missN=0;const nl=[];
  for(let d=D;d>=1;d--){if(fri(d))continue;for(let g=0;g<G;g++)if(cell(d,g)==='0'){missN++;const tx=(S.notes||{})[d+':'+g];if(tx)nl.push({d,g,tx})}}

$('list').addEventListener('click',e=>{const b=e.target.closest('.bkb');if(!b)return;const g=+b.dataset.p,k=cur+':'+g;
  if(S.pay[k])delete S.pay[k];
  else{const t=S.tgt[g]||0,a=Math.min(t,bank(cur).bal);if(a<=0){alert('Bank is empty');return}S.pay[k]=a}
  save();render()});
$('pv').onclick=()=>{cur--;render()};$('nx').onclick=()=>{cur++;render()};
$('dt').onclick=()=>{cur=todayIdx();render()};
let x0=null;const L=$('v1');
L.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
L.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>70){cur+=dx<0?1:-1;render()}});

$('start').onchange=e=>{if(e.target.value){S.start=e.target.value;save();render()}};
$('days').onchange=e=>{S.days=Math.max(1,Math.min(365,+e.target.value||1));save();render()};
$('gl').onchange=e=>{const sk=e.target.dataset.s!==undefined?'sub':e.target.dataset.k!==undefined?'tk':'';if(sk){S[sk][+(e.target.dataset.s??e.target.dataset.k)]=e.target.value.trim();save();render();return}
  const t=e.target.dataset.t;if(t!==undefined){S.tgt[+t]=Math.max(0,Math.min(1440,+e.target.value||0));save();render();return}const g=e.target.dataset.g;if(g!==undefined){S.goals[+g]=e.target.value.trim()||'Goal';save();render()}};
$('gl').onclick=e=>{const g=e.target.dataset.x;if(g===undefined||S.goals.length<2)return;
  if(!confirm('এই goal ও তার ডেটা মুছবেন?'))return;
  const i=+g;S.goals.splice(i,1);S.tgt.splice(i,1);S.sub.splice(i,1);S.tk.splice(i,1);S.notes=rx(S.notes,i);S.cat=rx(S.cat,i);S.pay=rx(S.pay,i);for(const k in S.log){const a=S.log[k].split('');a.splice(i,1);S.log[k]=a.join('')}
  save();renderSettings();render()};
$('frsw').onclick=()=>{S.fb=(S.fb===false);save();renderSettings();render()};
$('addg').onclick=()=>{if(S.goals.length<12){S.goals.push('New goal');save();renderSettings();render()}};
function chk(){let h=true;try{h=!localStorage.getItem(KEY+'_prev')}catch(e){}$('undo').classList.toggle('hide',h)}
$('rst').onclick=()=>{if(confirm('সব ✓/✕ এন্ট্রি মুছবেন? Goal ও তারিখ থাকবে। পরে Undo করা যাবে।')){try{localStorage.setItem(KEY+'_prev',JSON.stringify(S))}catch(e){}S.log={};S.notes={};S.cat={};S.rec={};S.ex={};S.pay={};save();render();chk()}};
$('undo').onclick=()=>{try{const x=JSON.parse(localStorage.getItem(KEY+'_prev'));if(x){S=x;save();localStorage.removeItem(KEY+'_prev');render();renderSettings();chk()}}catch(e){}};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='habit_backup.json';a.click()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(s.goals&&s.log){S=s;save();render();renderSettings()}else alert('ভুল ফাইল')}catch(x){alert('ভুল ফাইল')}};r.readAsText(f)};

$('csv').onclick=()=>{C={url:$('cu').value.trim(),key:$('ck').value.trim()};try{localStorage.setItem(SK,JSON.stringify(C))}catch(e){}if(!C.url||!C.key){st('URL আর Secret code দুটোই দিন');return}st('Syncing…');pull(false)};
$('crs').onclick=()=>{C={url:$('cu').value.trim(),key:$('ck').value.trim()};try{localStorage.setItem(SK,JSON.stringify(C))}catch(e){}st('Loading…');pull(true)};
$('pmp').onclick=()=>window.print();$('pmb').onclick=pmOff;
function show(n){view=n;[1,2,3].forEach(i=>{$('v'+i).classList.toggle('hide',i!==n);$('t'+i).classList.toggle('on',i===n)});if(n===3)renderSettings();scrollTo(0,0)}
[1,2,3].forEach(i=>$('t'+i).onclick=()=>show(i));
cur=todayIdx();render();chk();setInterval(cd,1000);initCB().then(()=>pull(false));
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
